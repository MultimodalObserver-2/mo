[project]
name = "api"
version = "0.1.0"
description = ""
authors = [
    {name = "Matías Figueroa Contreras",email = "matias.figueroa.c@usach.cl"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.1,<0.35.0)",
    "filelock (>=3.18.0,<4.0.0)",
]

[tool.poetry]
packages = [{include = "api", from = "src"}]

[tool.poetry.scripts]
dev = "scripts.dev:start"
format = "scripts.format:format_code"
sonar = "scripts.sonar:scan"
test = "scripts.test:run_tests"

[tool.black]
line-length = 100

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.13.0"
black = "^25.1.0"
isort = "^6.0.1"
pysonar = "^1.0.1.1548"
python-dotenv = "^1.1.0"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
include_namespace_packages = true
omit = ["**/__init__.py"]
skip_empty = true